name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the current tree and newly introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true
        run: |
          scan() {
            docker run --rm --user "$(id -u):$(id -g)" --network none \
              -v "$PWD:/repo:ro" -e GITLEAKS_CONFIG_TOML "$GITLEAKS_IMAGE" \
              "$@" --redact=100 --no-banner --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null
          }
          scan dir /repo
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            scan git /repo --log-opts="$BASE_SHA..$GITHUB_SHA"
          fi
